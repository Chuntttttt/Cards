[project]
name = "cards"
version = "0.1.0"
description = "Turn directories of images into printable pdfs of card sheets"
authors = [{name = "James Power", email = "jep@lepoer.us"}]
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "pyinstaller>=5.0",
]

[project.scripts]
cards = "cards.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
ignore_missing_imports = true
