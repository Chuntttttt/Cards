<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards - Print & Play PDF Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        canvas {
            width: 100%;
            height: 100vh;
        }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z"/>
</head>
<body>
    <div id="loading">
        <h1>Loading Cards...</h1>
        <p>Please wait while the application initializes.</p>
    </div>
    <canvas id="the_canvas_id"></canvas>

    <script type="module">
        // Wait for trunk to load the WASM module
        window.addEventListener('TrunkApplicationStarted', async (event) => {
            // Get the bindings from the global scope
            const { start } = window.wasmBindings;
            try {
                await start();
                // Hide loading screen after successful start
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Failed to start application:', error);
                document.getElementById('loading').innerHTML =
                    '<h1>Error Starting Application</h1><p>' + error + '</p>';
            }
        });
    </script>
</body>
</html>
