[package]
name = "cards-wasm"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
cards-core = { path = "../cards-core" }
eframe = "0.29"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
log = "0.4"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Url", "Window", "Document", "HtmlAnchorElement", "BlobPropertyBag", "HtmlCanvasElement", "Element"] }

[lib]
crate-type = ["cdylib"]
